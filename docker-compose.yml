version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ACADEMIA_PORT=8080
      - ACADEMIA_DB_PATH=/app/data/academia.db
      - ACADEMIA_LOG_FILE=/app/logs/server.log
      - ACADEMIA_THREADS=4
    volumes:
      - db-data:/app/data
      - server-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
  server-logs:
